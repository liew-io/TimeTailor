<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TimeTailor: Auth & Admin Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <!-- 顶部导航 -->
  <header class="bg-slate-800/80 backdrop-blur-md border-b border-slate-700/60 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="bg-indigo-600 text-white p-2 rounded-xl">
          <i data-lucide="clock" class="w-5 h-5"></i>
        </div>
        <h1 class="text-lg font-extrabold text-white">TimeTailor</h1>
      </div>
      
      <!-- 用户状态控制区域 -->
      <div id="auth-status-bar" class="flex items-center gap-3 text-xs">
        <span id="user-display" class="text-slate-400">Not logged in</span>
        <button id="logout-btn" onclick="handleLogout()" class="hidden bg-rose-500/20 text-rose-300 border border-rose-500/30 px-3 py-1.5 rounded-lg hover:bg-rose-500/30 transition">Logout</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8">

    <!-- 1. 登录/注册模块 (未登录时显示) -->
    <section id="auth-section" class="max-w-md mx-auto bg-slate-800/90 p-8 rounded-2xl border border-slate-700 shadow-2xl space-y-6">
      <div class="text-center">
        <h2 class="text-xl font-bold text-white">Welcome to TimeTailor</h2>
        <p class="text-xs text-slate-400 mt-1">Sign in or create an account to start</p>
      </div>

      <form id="auth-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Email</label>
          <input type="email" id="auth-email" placeholder="student@example.com" class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm outline-none focus:border-indigo-500 text-white" required>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Password (Min 6 chars)</label>
          <input type="password" id="auth-password" placeholder="••••••••" class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm outline-none focus:border-indigo-500 text-white" required>
        </div>

        <div class="grid grid-cols-2 gap-3 pt-2">
          <button type="button" onclick="handleLogin()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-xl text-sm transition">Log In</button>
          <button type="button" onclick="handleRegister()" class="bg-slate-700 hover:bg-slate-600 text-white font-semibold py-2.5 rounded-xl text-sm transition">Register</button>
        </div>
      </form>
    </section>

    <!-- 2. 主面板 (登录后显示) -->
    <div id="app-section" class="hidden space-y-8">
      
      <!-- 管理员特权版块：查看所有注册用户资料 -->
      <section id="admin-panel" class="bg-indigo-950/40 border border-indigo-500/30 p-6 rounded-2xl shadow-xl">
        <div class="flex items-center justify-between mb-4">
          <div class="flex items-center gap-2">
            <i data-lucide="shield-check" class="w-5 h-5 text-indigo-400"></i>
            <h3 class="font-bold text-white text-base">Admin Dashboard: Registered Users Directory</h3>
          </div>
          <span id="user-count-badge" class="text-xs bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 font-semibold px-2.5 py-1 rounded-md">0 Total Users</span>
        </div>

        <!-- 所有用户资料表格 -->
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs">
            <thead class="bg-slate-800 text-slate-400 uppercase tracking-wider border-b border-slate-700">
              <tr>
                <th class="p-3">User ID (UID)</th>
                <th class="p-3">Email Address</th>
                <th class="p-3">Role</th>
                <th class="p-3">Joined Date</th>
              </tr>
            </thead>
            <tbody id="admin-users-table-body" class="divide-y divide-slate-800 text-slate-300">
              <tr>
                <td colspan="4" class="p-4 text-center text-slate-500">Loading user database...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <!-- 普通功能区: 个人任务输入 -->
      <section class="grid grid-cols-1 lg:grid-cols-12 gap-8">
        <div class="lg:col-span-5 bg-slate-800/90 p-6 rounded-2xl border border-slate-700">
          <h3 class="font-bold text-white text-base mb-4 flex items-center gap-2">
            <i data-lucide="plus-circle" class="w-4 h-4 text-indigo-400"></i> Add Your Personal Task
          </h3>
          <form id="user-task-form" class="space-y-4">
            <input type="text" id="task-title" placeholder="Task Name" class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white" required>
            <input type="text" id="task-location" placeholder="Venue / Destination" class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white" required>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-xl font-semibold text-sm">Save Task</button>
          </form>
        </div>

        <div class="lg:col-span-7 bg-slate-800/90 p-6 rounded-2xl border border-slate-700">
          <h3 class="font-bold text-white text-base mb-4">Your Synced Tasks</h3>
          <div id="user-tasks-container" class="space-y-2.5 text-xs text-slate-400">
            No tasks found.
          </div>
        </div>
      </section>

    </div>

  </main>

  <!-- Firebase Modular JS SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getDatabase, ref, set, push, onValue 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // 读取你截图中的完整配置
    const firebaseConfig = {
      apiKey: "AIzaSyCXHA2nPQvrE7AObmCCxfya3hr-D8g8rKk",
      authDomain: "timetailor-733b0.firebaseapp.com",
      databaseURL: "https://timetailor-733b0-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "timetailor-733b0",
      storageBucket: "timetailor-733b0.firebasestorage.app",
      messagingSenderId: "257600117939",
      appId: "1:257600117939:web:676d93e933fba3ff5a64c6",
      measurementId: "G-V43HL152FQ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentUser = null;

    // 1. 注册账号
    window.handleRegister = async function() {
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;

      if (!email || !password) return alert("Please fill in Email and Password");
      if (password.length < 6) return alert("Password must be at least 6 characters long!");

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        // 保存资料到 Realtime Database
        await set(ref(db, `users/${user.uid}`), {
          email: user.email,
          role: "student",
          createdAt: Date.now()
        });

        alert("Registration Successful!");
      } catch (err) {
        alert("Register Error: " + err.message);
      }
    };

    // 2. 登录账号
    window.handleLogin = async function() {
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;

      if (!email || !password) return alert("Please enter Email and Password");

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        alert("Login Error: " + err.message);
      }
    };

    // 3. 退出登录
    window.handleLogout = function() {
      signOut(auth);
    };

    // 4. 监听登录状态
    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      const authSection = document.getElementById('auth-section');
      const appSection = document.getElementById('app-section');
      const logoutBtn = document.getElementById('logout-btn');
      const userDisplay = document.getElementById('user-display');

      if (user) {
        authSection.classList.add('hidden');
        appSection.classList.remove('hidden');
        logoutBtn.classList.remove('hidden');
        userDisplay.innerText = `Logged in: ${user.email}`;

        fetchAllUsers();
        fetchUserTasks(user.uid);
      } else {
        authSection.classList.remove('hidden');
        appSection.classList.add('hidden');
        logoutBtn.classList.add('hidden');
        userDisplay.innerText = "Not logged in";
      }
    });

    // 5. 读取所有注册用户资料 (Admin View)
    function fetchAllUsers() {
      const usersRef = ref(db, 'users');
      onValue(usersRef, (snapshot) => {
        const usersData = snapshot.val();
        const tbody = document.getElementById('admin-users-table-body');
        const countBadge = document.getElementById('user-count-badge');

        if (!usersData) {
          tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-500">No users found in database.</td></tr>`;
          return;
        }

        const userKeys = Object.keys(usersData);
        countBadge.innerText = `${userKeys.length} Total Users`;

        tbody.innerHTML = userKeys.map(uid => {
          const u = usersData[uid];
          const dateStr = u.createdAt ? new Date(u.createdAt).toLocaleDateString() : 'N/A';
          return `
            <tr class="hover:bg-slate-800/60 transition">
              <td class="p-3 font-mono text-indigo-300">${uid.substring(0, 8)}...</td>
              <td class="p-3 font-bold text-slate-100">${u.email}</td>
              <td class="p-3"><span class="px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 text-[10px] uppercase font-bold">${u.role || 'student'}</span></td>
              <td class="p-3 text-slate-400">${dateStr}</td>
            </tr>
          `;
        }).join('');
      });
    }

    // 6. 任务添加与获取
    document.getElementById('user-task-form').addEventListener('submit', (e) => {
      e.preventDefault();
      if (!currentUser) return;

      const title = document.getElementById('task-title').value;
      const location = document.getElementById('task-location').value;

      push(ref(db, `tasks/${currentUser.uid}`), {
        title, location, createdAt: Date.now()
      });

      e.target.reset();
    });

    function fetchUserTasks(uid) {
      onValue(ref(db, `tasks/${uid}`), (snapshot) => {
        const data = snapshot.val();
        const container = document.getElementById('user-tasks-container');
        if (!data) {
          container.innerHTML = `<p class="text-slate-500">No tasks saved yet.</p>`;
          return;
        }
        container.innerHTML = Object.keys(data).map(k => `
          <div class="p-3 bg-slate-900 border border-slate-700 rounded-xl flex justify-between">
            <span class="font-bold text-white">${data[k].title}</span>
            <span>📍 ${data[k].location}</span>
          </div>
        `).join('');
      });
    }

    lucide.createIcons();
  </script>
</body>
</html>
